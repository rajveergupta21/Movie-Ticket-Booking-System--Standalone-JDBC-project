<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — CineVerse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-host"></div>

    <main class="main-container">
        <div class="auth-wrapper">
            <h1 class="auth-title">Create Your Account</h1>
            <p class="auth-subtitle">Join CineVerse for instant seat bookings and digital ticket passes.</p>

            <div id="register-alert" style="display: none;"></div>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Aarav Sharma" required minlength="2">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="aarav@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+91 98300 22222" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password (Min 6 characters)</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a strong password" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px;">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login.html">Sign In Here</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        CineVerse Standalone Java Cinema Booking System
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await CineVerse.initNavbar("register");
            const form = document.getElementById("register-form");
            const alertBox = document.getElementById("register-alert");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                alertBox.style.display = "none";

                const name = document.getElementById("name").value.trim();
                const email = document.getElementById("email").value.trim();
                const phone = document.getElementById("phone").value.trim();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirm-password").value;

                if (password !== confirmPassword) {
                    alertBox.className = "alert-box alert-error";
                    alertBox.textContent = "Passwords do not match.";
                    alertBox.style.display = "block";
                    return;
                }

                const result = await CineVerse.postForm("/api/register", { name, email, phone, password });
                if (!result.ok) {
                    alertBox.className = "alert-box alert-error";
                    alertBox.textContent = result.data.error || "Registration failed.";
                    alertBox.style.display = "block";
                    return;
                }

                window.location.href = "/movies.html";
            });
        });
    </script>
</body>
</html>
