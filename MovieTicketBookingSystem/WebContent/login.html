<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — CineVerse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-host"></div>

    <main class="main-container">
        <div class="auth-wrapper">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to reserve seats and manage your cinema passes.</p>

            <div id="login-alert" style="display: none;"></div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="user@cineverse.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px;">Sign In</button>
            </form>

            <div style="margin-top: 18px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 0.82rem; color: var(--text-secondary);">
                <div><strong>Demo Admin:</strong> admin@cineverse.com / admin123</div>
                <div><strong>Demo User:</strong> user@cineverse.com / user123</div>
            </div>

            <div class="auth-footer">
                New to CineVerse? <a href="/register.html">Create an Account</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        CineVerse Standalone Java Cinema Booking System
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await CineVerse.initNavbar("login");
            const form = document.getElementById("login-form");
            const alertBox = document.getElementById("login-alert");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                alertBox.style.display = "none";

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;

                const result = await CineVerse.postForm("/api/login", { email, password });
                if (!result.ok) {
                    alertBox.className = "alert-box alert-error";
                    alertBox.textContent = result.data.error || "Sign in failed.";
                    alertBox.style.display = "block";
                    return;
                }

                const params = new URLSearchParams(window.location.search);
                const redirect = params.get("redirect");
                if (redirect) {
                    window.location.href = redirect;
                } else if (result.data.user && result.data.user.role === "ADMIN") {
                    window.location.href = "/admin.html";
                } else {
                    window.location.href = "/movies.html";
                }
            });
        });
    </script>
</body>
</html>
