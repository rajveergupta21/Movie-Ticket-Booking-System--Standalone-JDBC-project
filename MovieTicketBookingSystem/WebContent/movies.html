<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Movies &amp; Showtimes — CineVerse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-host"></div>

    <main class="main-container">
        <div style="margin-bottom: 24px;">
            <h1 style="font-size: 2rem; font-weight: 800;">Explore Movies &amp; Showtimes</h1>
            <p style="color: var(--text-secondary);">Filter by city, genre, and language, then select any showtime to pick your seats.</p>
        </div>

        <section class="filter-bar">
            <div class="form-group">
                <label class="form-label" for="filter-city">City</label>
                <select id="filter-city" class="form-control">
                    <option value="All">All Cities</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Kolkata">Kolkata</option>
                    <option value="Bengaluru">Bengaluru</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Hyderabad">Hyderabad</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="filter-genre">Genre</label>
                <select id="filter-genre" class="form-control">
                    <option value="All">All Genres</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Drama">Drama</option>
                    <option value="Action">Action</option>
                    <option value="Animation">Animation</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="filter-language">Language</label>
                <select id="filter-language" class="form-control">
                    <option value="All">All Languages</option>
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Tamil">Tamil</option>
                    <option value="Bengali">Bengali</option>
                    <option value="Telugu">Telugu</option>
                </select>
            </div>
            <div>
                <button type="button" id="reset-filters-btn" class="btn btn-outline" style="width: 100%;">Reset Filters</button>
            </div>
        </section>

        <div id="movies-catalog-grid" class="movies-grid"></div>
    </main>

    <footer class="footer">
        CineVerse Standalone Java Cinema Booking System
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await CineVerse.initNavbar("movies");

            const citySelect = document.getElementById("filter-city");
            const genreSelect = document.getElementById("filter-genre");
            const langSelect = document.getElementById("filter-language");
            const resetBtn = document.getElementById("reset-filters-btn");
            const grid = document.getElementById("movies-catalog-grid");

            async function loadCatalog() {
                const city = citySelect.value;
                const genre = genreSelect.value;
                const language = langSelect.value;

                const query = new URLSearchParams({ city, genre, language }).toString();
                const [moviesRes, showsRes] = await Promise.all([
                    fetch(`/api/movies?${query}`),
                    fetch(`/api/shows?city=${encodeURIComponent(city)}`)
                ]);

                const moviesData = await moviesRes.json();
                const showsData = await showsRes.json();

                const showsByMovie = {};
                showsData.forEach((sh) => {
                    if (!showsByMovie[sh.movieId]) {
                        showsByMovie[sh.movieId] = [];
                    }
                    showsByMovie[sh.movieId].push(sh);
                });

                if (!moviesData.movies || moviesData.movies.length === 0) {
                    grid.innerHTML = `
                        <div class="panel-card" style="grid-column: 1 / -1; text-align: center;">
                            <h3>No movies match the selected filters.</h3>
                            <p style="color: var(--text-secondary); margin-top: 6px;">Try resetting the city, genre, or language filters.</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = moviesData.movies.map((m) => {
                    const mShows = showsByMovie[m.id] || [];
                    const groupedByTheatre = {};
                    mShows.forEach((sh) => {
                        const key = `${sh.theatreName} (${sh.theatreCity}) — ${sh.screenName}`;
                        if (!groupedByTheatre[key]) {
                            groupedByTheatre[key] = [];
                        }
                        groupedByTheatre[key].push(sh);
                    });

                    const theatreBlocks = Object.keys(groupedByTheatre).map((tName) => {
                        const pills = groupedByTheatre[tName].map((s) => {
                            return `
                                <a href="/seat-selection.html?showId=${s.id}" class="showtime-pill" title="${s.availableSeats} seats available">
                                    ${CineVerse.escapeHtml(s.showDate)} &bull; ${CineVerse.escapeHtml(s.showTime)}
                                </a>
                            `;
                        }).join("");
                        return `
                            <div style="margin-top: 6px;">
                                <div class="theatre-group-label">${CineVerse.escapeHtml(tName)}</div>
                                <div class="showtime-pills" style="margin-top: 4px;">${pills}</div>
                            </div>
                        `;
                    }).join("");

                    return `
                        <article class="movie-card">
                            <div class="movie-poster-art" style="background: ${CineVerse.escapeHtml(m.posterColor)};">
                                <span class="movie-badge-top">${CineVerse.escapeHtml(m.badgeText)}</span>
                                <span class="movie-rating-pill">${CineVerse.escapeHtml(m.rating)}</span>
                                <h3 class="movie-poster-title">${CineVerse.escapeHtml(m.title)}</h3>
                            </div>
                            <div class="movie-card-body">
                                <div class="movie-meta">
                                    <span class="badge badge-crimson">${CineVerse.escapeHtml(m.genre)}</span>
                                    <span class="badge">${CineVerse.escapeHtml(m.language)}</span>
                                    <span class="badge">${m.durationMinutes} mins</span>
                                </div>
                                <p class="movie-synopsis">${CineVerse.escapeHtml(m.description)}</p>
                                <div class="showtime-list">
                                    ${theatreBlocks || `<span class="badge">No showtimes scheduled in this city</span>`}
                                </div>
                            </div>
                        </article>
                    `;
                }).join("");
            }

            citySelect.addEventListener("change", loadCatalog);
            genreSelect.addEventListener("change", loadCatalog);
            langSelect.addEventListener("change", loadCatalog);
            resetBtn.addEventListener("click", () => {
                citySelect.value = "All";
                genreSelect.value = "All";
                langSelect.value = "All";
                loadCatalog();
            });

            loadCatalog();
        });
    </script>
</body>
</html>
