<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Booked! — CineVerse Digital Ticket</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-host"></div>

    <main class="main-container">
        <div class="ticket-pass-container">
            <div class="ticket-banner-success">
                <h1>Seat Booked!</h1>
                <p style="margin-top: 4px;">Your reservation is confirmed and locked in the auditorium database.</p>
            </div>

            <div id="ticket-stub-host"></div>

            <div style="display: flex; justify-content: center; gap: 16px; margin-top: 28px; flex-wrap: wrap;">
                <a href="/my-bookings.html" class="btn btn-primary">View All My Bookings</a>
                <a href="/movies.html" class="btn btn-outline">Book Another Movie</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        CineVerse Standalone Java Cinema Booking System
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await CineVerse.initNavbar("bookings");

            const params = new URLSearchParams(window.location.search);
            const bookingId = params.get("id");
            const host = document.getElementById("ticket-stub-host");

            if (!bookingId) {
                window.location.href = "/my-bookings.html";
                return;
            }

            const res = await fetch(`/api/booking?id=${encodeURIComponent(bookingId)}`);
            if (!res.ok) {
                host.innerHTML = `<div class="alert-box alert-error">Unable to load ticket confirmation.</div>`;
                return;
            }

            const b = await res.json();
            host.innerHTML = `
                <article class="ticket-stub">
                    <div class="ticket-header">
                        <div>
                            <div style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.9;">CineVerse Official Digital Pass</div>
                            <div style="font-size: 1.45rem; font-weight: 900; margin-top: 2px;">${CineVerse.escapeHtml(b.movieTitle)}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 0.75rem; text-transform: uppercase; opacity: 0.9;">Booking ID</div>
                            <div style="font-size: 1.2rem; font-weight: 900; font-family: monospace;">${CineVerse.escapeHtml(b.bookingCode)}</div>
                        </div>
                    </div>
                    <div class="ticket-body">
                        <div>
                            <div class="ticket-field-label">Theatre &amp; City</div>
                            <div class="ticket-field-value">${CineVerse.escapeHtml(b.theatreName)} (${CineVerse.escapeHtml(b.theatreCity)})</div>
                        </div>
                        <div>
                            <div class="ticket-field-label">Auditorium Screen</div>
                            <div class="ticket-field-value">${CineVerse.escapeHtml(b.screenName)}</div>
                        </div>
                        <div>
                            <div class="ticket-field-label">Show Date &amp; Time</div>
                            <div class="ticket-field-value">${CineVerse.escapeHtml(b.showDate)} &bull; ${CineVerse.escapeHtml(b.showTime)}</div>
                        </div>
                        <div>
                            <div class="ticket-field-label">Reserved Seat Numbers</div>
                            <div class="ticket-field-value" style="color: var(--gold-accent);">${CineVerse.escapeHtml(b.seatLabels)} (${CineVerse.escapeHtml(b.seatCategories)})</div>
                        </div>
                        <div>
                            <div class="ticket-field-label">Attendee</div>
                            <div class="ticket-field-value">${CineVerse.escapeHtml(b.userName)}</div>
                        </div>
                        <div>
                            <div class="ticket-field-label">Reservation Status</div>
                            <div class="ticket-field-value"><span class="badge badge-emerald">${CineVerse.escapeHtml(b.status)}</span></div>
                        </div>
                    </div>
                </article>
            `;
        });
    </script>
</body>
</html>
