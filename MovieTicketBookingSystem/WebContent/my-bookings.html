<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings — CineVerse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-host"></div>

    <main class="main-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <div>
                <h1 style="font-size: 2rem; font-weight: 800;">My Ticket Passes</h1>
                <p style="color: var(--text-secondary);">View your active reservations or cancel to release seats back to the auditorium.</p>
            </div>
            <a href="/movies.html" class="btn btn-primary">Book New Tickets</a>
        </div>

        <div id="bookings-alert" style="display: none;"></div>
        <div id="bookings-list-host" style="display: flex; flex-direction: column; gap: 18px;"></div>
    </main>

    <footer class="footer">
        CineVerse Standalone Java Cinema Booking System
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await CineVerse.initNavbar("bookings");

            if (!CineVerse.sessionUser) {
                window.location.href = "/login.html?redirect=/my-bookings.html";
                return;
            }

            const host = document.getElementById("bookings-list-host");
            const alertBox = document.getElementById("bookings-alert");

            async function loadMyBookings() {
                const res = await fetch("/api/my-bookings");
                if (!res.ok) {
                    host.innerHTML = `<div class="alert-box alert-error">Failed to load your bookings.</div>`;
                    return;
                }
                const bookings = await res.json();
                if (bookings.length === 0) {
                    host.innerHTML = `
                        <div class="panel-card" style="text-align: center; padding: 48px 24px;">
                            <h3>You haven't booked any seats yet.</h3>
                            <p style="color: var(--text-secondary); margin: 8px 0 20px 0;">Select a movie showtime and pick your favorite seats.</p>
                            <a href="/movies.html" class="btn btn-primary">Explore Showtimes</a>
                        </div>
                    `;
                    return;
                }

                host.innerHTML = bookings.map((b) => {
                    const isConfirmed = b.status === "CONFIRMED";
                    const statusBadge = isConfirmed
                        ? `<span class="badge badge-emerald">CONFIRMED</span>`
                        : `<span class="badge badge-crimson">CANCELLED</span>`;

                    const actionButtons = isConfirmed
                        ? `
                            <a href="/booking-confirmation.html?id=${b.id}" class="btn btn-outline btn-sm">View Ticket Stub</a>
                            <button type="button" class="btn btn-danger btn-sm cancel-booking-btn" data-id="${b.id}">Cancel Booking</button>
                        `
                        : "";

                    return `
                        <div class="panel-card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 0;">
                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span style="font-family: monospace; font-weight: 800; color: var(--gold-accent);">${CineVerse.escapeHtml(b.bookingCode)}</span>
                                    ${statusBadge}
                                    <span style="font-size: 0.8rem; color: var(--text-muted);">Booked ${CineVerse.escapeHtml(b.bookedAt)}</span>
                                </div>
                                <h3 style="font-size: 1.35rem; font-weight: 800;">${CineVerse.escapeHtml(b.movieTitle)}</h3>
                                <div style="color: var(--text-secondary); font-size: 0.94rem;">
                                    ${CineVerse.escapeHtml(b.theatreName)} (${CineVerse.escapeHtml(b.theatreCity)}) &bull;
                                    <strong>${CineVerse.escapeHtml(b.screenName)}</strong> &bull;
                                    ${CineVerse.escapeHtml(b.showDate)} at ${CineVerse.escapeHtml(b.showTime)}
                                </div>
                                <div style="font-size: 0.95rem;">
                                    <strong>Seats:</strong> <span style="color: var(--gold-accent); font-weight: 700;">${CineVerse.escapeHtml(b.seatLabels)} (${CineVerse.escapeHtml(b.seatCategories)})</span>
                                </div>
                            </div>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                ${actionButtons}
                            </div>
                        </div>
                    `;
                }).join("");

                host.querySelectorAll(".cancel-booking-btn").forEach((btn) => {
                    btn.addEventListener("click", async () => {
                        const bookingId = btn.getAttribute("data-id");
                        const result = await CineVerse.postForm("/api/cancel-booking", { bookingId });
                        if (result.ok) {
                            alertBox.className = "alert-box alert-success";
                            alertBox.textContent = result.data.message;
                            alertBox.style.display = "block";
                            loadMyBookings();
                        } else {
                            alertBox.className = "alert-box alert-error";
                            alertBox.textContent = result.data.error || "Failed to cancel booking.";
                            alertBox.style.display = "block";
                        }
                    });
                });
            }

            loadMyBookings();
        });
    </script>
</body>
</html>
